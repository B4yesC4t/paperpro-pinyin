name: 构建与发布

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # arm64 运行器：容器原生运行，不需要 qemu。
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Qt SDK
        uses: actions/cache@v4
        with:
          path: .cache/qt
          key: qt-6.10.3-linux_gcc_arm64

      - name: 构建
        run: sh scripts/build.sh

      - name: 打包
        run: sh scripts/package.sh

      - name: 检查版本号与标签一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: paperpro-pinyin
          path: dist/*

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="$(cat VERSION)" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/paperpro-pinyin.tar.gz dist/paperpro-pinyin.tar.gz.sha256 \
            --title "PaperPro 拼音 $GITHUB_REF_NAME" --notes "$notes"
